services:
  qbittorrent:
    image: ghcr.io/gautamkrishnar/qbtorrent-adguardvpn:latest
    build: .
    container_name: qbittorrent-vpn
    stop_grace_period: 75s
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
      - HOME=/config
      - AGVPN_CLI_DATA_PATH=/adguard-config
      - S6_KILL_GRACETIME=60000
      - QBT_VPN_INTERFACE=${QBT_VPN_INTERFACE:-tun0}
    volumes:
      - qbittorrent_config:/config
      - adguardvpn_config:/adguard-config
      - type: bind
        source: '${DOWNLOADS_PATH:?Set DOWNLOADS_PATH in .env}'
        target: '/downloads'
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

volumes:
  qbittorrent_config:
  adguardvpn_config:
